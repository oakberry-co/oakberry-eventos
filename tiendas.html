<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F5EEE0">
<title>Tiendas · OAKBERRY Colombia</title>
<meta name="description" content="Encuentra tu OAKBERRY más cercano: 34 tiendas en 11 ciudades de Colombia.">
<meta property="og:title" content="Encuentra tu OAKBERRY">
<link rel="preload" href="pd-assets/nexa-slab-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="pd-assets/nexa-slab-bold.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
/* ─────────────────────────────────────────────────────────────────────────
   TIENDAS · versión con el kit gráfico (16-oct-2026) de oakberry-cupones.com/tiendas.
   Datos: api.oakberry-cupones.com ?accion=obtenerTiendasCompleto (Postgres `tiendas`, que se llena de la
   hoja «Ubicaciones Oakberry» con adquisicion/db/sync_tiendas_from_sheet.py). Los horarios están en el
   link de Google Maps de cada tienda. Mapa: Leaflet + teselas de OpenStreetMap.
   ───────────────────────────────────────────────────────────────────────── */
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-bold.woff2') format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-black.woff2') format('woff2');font-weight:800 900;font-display:swap}
:root{--crema:#FBF6E9;--cielo:#F5EEE0;--hueso:#EAE1CC;--tinta:#21152A;--tinta-suave:#5C4A66;
  --morado:#4B1F60;--lila:#B79CC8;--oro:#F4B223;--verde:#2F6B3A}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--cielo)}
body{font-family:'Nexa Slab',Rockwell,Georgia,serif;color:var(--tinta);background:var(--cielo);min-height:100dvh}
main{max-width:560px;margin:0 auto;padding:0 16px 50px}
.oculto{display:none!important}

.cielo{position:relative;overflow:hidden;margin:0 -16px;padding:20px 16px calc(min(100vw,560px) * .58);
  background:url('pd-assets/escena-rio.jpg') center bottom/100% auto no-repeat,var(--cielo)}
.sol{position:absolute;top:-34px;right:-40px;width:130px}
.loro{position:absolute;top:44px;right:6%;width:96px;animation:vuela 4.5s ease-in-out infinite}
.pajaros{position:absolute;top:30px;left:12px;width:90px;opacity:.7}
@keyframes vuela{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.marca{position:relative;width:min(36vw,140px);height:auto;display:block}
.cielo h1{position:relative;font-size:clamp(1.9rem,9vw,2.6rem);font-weight:900;line-height:.92;text-transform:uppercase;
  color:var(--morado);margin:18px 0 8px;max-width:9ch}
.cielo p{position:relative;font-weight:600;color:var(--tinta-suave)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:900;
  text-transform:uppercase;letter-spacing:.04em;font-size:.95rem;padding:15px;border-radius:999px;border:3px solid var(--tinta);
  box-shadow:0 6px 0 var(--tinta);cursor:pointer;text-decoration:none;color:var(--tinta)}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tinta)}
.btn.oro{background:var(--oro)}
#ubicar{position:relative;z-index:5;margin-top:-26px}
.estado{font-size:.84rem;font-weight:600;color:var(--tinta-suave);text-align:center;margin:12px 0 2px;min-height:1.2em}

.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:2px solid var(--tinta);background:#fff;color:var(--tinta);border-radius:999px;padding:8px 14px;font:inherit;
  font-weight:800;font-size:.86rem;box-shadow:0 3px 0 var(--tinta);cursor:pointer;white-space:nowrap}
.chip.sel{background:var(--morado);color:var(--crema)}

.mapa{height:300px;filter:saturate(.85);border:3px solid var(--tinta);border-radius:22px;overflow:hidden;box-shadow:0 6px 0 var(--tinta);margin:6px 0 18px;z-index:1}
.leaflet-container{font-family:inherit}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid var(--tinta);
  background:var(--morado);box-shadow:0 3px 0 rgba(33,21,42,.35)}
.pin.cerca{background:var(--oro)}
.pin.yo{background:#5BD27A;border-radius:50%;transform:none;width:20px;height:20px}
.leaflet-popup-content-wrapper{border:2px solid var(--tinta);border-radius:14px;box-shadow:0 4px 0 var(--tinta)}
.leaflet-popup-content{margin:12px 14px;font-size:.9rem}
.leaflet-popup-content b{display:block;font-weight:900;color:var(--morado);text-transform:uppercase}
.leaflet-popup-content a{color:var(--morado);font-weight:800}

.lista{display:flex;flex-direction:column;gap:14px}
.tienda{background:#fff;border:3px solid var(--tinta);border-radius:20px;padding:14px 16px;box-shadow:0 6px 0 var(--tinta)}
.tienda.cerca{background:var(--oro)}
.tienda .fila{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.badge{font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:999px;
  border:2px solid var(--tinta);background:var(--crema)}
.badge.lila{background:var(--lila)}
.badge.dist{background:var(--tinta);color:var(--crema)}
.tienda h2{font-size:1.15rem;font-weight:900;text-transform:uppercase;line-height:1.05;color:var(--morado)}
.tienda.cerca h2{color:var(--tinta)}
.tienda .dir{font-size:.9rem;font-weight:600;color:var(--tinta-suave);margin:6px 0 12px}
.tienda.cerca .dir{color:var(--tinta)}
.acc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.acc a{display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-weight:900;font-size:.8rem;
  text-transform:uppercase;letter-spacing:.03em;color:var(--tinta);border:2px solid var(--tinta);border-radius:999px;padding:11px 8px;
  box-shadow:0 3px 0 var(--tinta);background:var(--crema)}
.acc a.ir{background:var(--morado);color:var(--crema)}
.tienda.cerca .acc a{background:#fff}.tienda.cerca .acc a.ir{background:var(--morado)}
.cargando{text-align:center;color:var(--tinta-suave);font-weight:600;padding:30px 0}
.maria{margin-top:26px}
.pie{text-align:center;font-size:.78rem;color:var(--tinta-suave);margin-top:16px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<main>
  <header class="cielo">
    <img class="sol" src="pd-assets/sol-loro.png" alt="" aria-hidden="true">
    <img class="pajaros" src="pd-assets/pajaros.png" alt="" aria-hidden="true">
    <img class="loro" src="pd-assets/loro-vuela.png" alt="" aria-hidden="true">
    <a href="links"><img class="marca" src="pd-wordmark-oakberry.svg" alt="OAKBERRY" width="3600" height="472"></a>
    <h1>Encuentra tu OAKBERRY</h1>
    <p id="conteo">Tiendas en toda Colombia</p>
  </header>

  <button class="btn oro" id="ubicar" type="button">📍 Ver la más cercana a mí</button>
  <p class="estado" id="estado"></p>
  <div class="chips" id="chips"></div>
  <div class="mapa" id="mapa"></div>
  <div class="lista" id="lista"><p class="cargando">Cargando tiendas…</p></div>

  <a class="btn oro maria" href="ayuda?src=tiendas">💬 ¿Dudas? Pregúntale a Oaky</a>
  <p class="pie">Los horarios de cada tienda están en su link de Google Maps.</p>
</main>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const API = 'https://api.oakberry-cupones.com/?accion=obtenerTiendasCompleto';
const RAPPI = 'https://rappi.sng.link/Ev50a/hene/03dq';
const $ = id => document.getElementById(id);
const esc = t => { const d = document.createElement('div'); d.textContent = t ?? ''; return d.innerHTML; };
// Jamundí va con Cali (área metropolitana), igual que en Oaky y en la pestaña Redes
const NOMBRE_CIUDAD = {bogota: 'Bogotá', medellin: 'Medellín', cucuta: 'Cúcuta', monteria: 'Montería', jamundi: 'Cali'};
const ciudadBonita = c => { const k = (c || '').trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  return NOMBRE_CIUDAD[k] || (c || '').trim().replace(/^\w/, x => x.toUpperCase()); };
const limpiar = n => (n || '').replace(/\s*Centro Comercial\s*$/i, '').replace(/^Centro Comercial\s*/i, 'CC ').trim();

let tiendas = [], ciudad = 'Todas', yo = null, cercana = null, marcas = [];
const mapa = L.map('mapa', {zoomControl: true, scrollWheelZoom: false}).setView([5.5, -74.5], 5);
// CARTO pide llave fuera de oakberry-cupones.com → teselas estándar de OpenStreetMap (con atribución)
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap', maxZoom: 19}).addTo(mapa);
const icono = clase => L.divIcon({className: '', html: `<div class="pin ${clase}"></div>`, iconSize: [30, 30], iconAnchor: [15, 30], popupAnchor: [0, -30]});

function km(a, b, c, d) { const R = 6371, r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r;
  const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); }
const fmt = k => k < 1 ? Math.round(k * 1000) + ' m' : k.toFixed(k < 10 ? 1 : 0).replace('.', ',') + ' km';

function pintar() {
  let lista = tiendas.filter(t => ciudad === 'Todas' || t.ciudad === ciudad);
  if (yo) lista = lista.map(t => ({...t, d: km(yo[0], yo[1], t.lat, t.lng)})).sort((a, b) => a.d - b.d);
  $('lista').innerHTML = lista.map(t => {
    const esCerca = cercana && t.nombre === cercana.nombre;
    return `<article class="tienda${esCerca ? ' cerca' : ''}">
      <div class="fila"><span class="badge lila">${esc(t.ciudad)}</span>${esCerca ? '<span class="badge">⭐ La más cercana</span>' : ''}
        ${t.d != null ? `<span class="badge dist">${fmt(t.d)}</span>` : ''}</div>
      <h2>${esc(t.nombre)}</h2>
      <p class="dir">${esc(t.direccion)}</p>
      <div class="acc"><a class="ir" href="${esc(t.mapsUrl)}" target="_blank" rel="noopener">🗺️ Cómo llegar y horario</a>
        <a href="${RAPPI}" target="_blank" rel="noopener">🛵 Pedir en Rappi</a></div>
    </article>`; }).join('') || '<p class="cargando">No hay tiendas en esta ciudad.</p>';
  marcas.forEach(m => mapa.removeLayer(m)); marcas = [];
  const puntos = [];
  lista.forEach(t => { if (t.lat == null) return;
    const m = L.marker([t.lat, t.lng], {icon: icono(cercana && t.nombre === cercana.nombre ? 'cerca' : '')}).addTo(mapa)
      .bindPopup(`<b>${esc(t.nombre)}</b>${esc(t.direccion)}<br><a href="${esc(t.mapsUrl)}" target="_blank" rel="noopener">Cómo llegar →</a>`);
    marcas.push(m); puntos.push([t.lat, t.lng]); });
  if (yo) { marcas.push(L.marker(yo, {icon: icono('yo')}).addTo(mapa).bindPopup('Estás aquí')); }
  if (yo && cercana && ciudad === 'Todas') mapa.fitBounds([yo, [cercana.lat, cercana.lng]], {padding: [50, 50], maxZoom: 15});
  else if (puntos.length) mapa.fitBounds(puntos, {padding: [30, 30], maxZoom: 15});
}

function chips() {
  const conteo = {}; tiendas.forEach(t => conteo[t.ciudad] = (conteo[t.ciudad] || 0) + 1);
  const ciudades = Object.keys(conteo).sort((a, b) => conteo[b] - conteo[a]);
  $('chips').innerHTML = ['Todas', ...ciudades].map(c =>
    `<button type="button" class="chip${c === ciudad ? ' sel' : ''}" data-c="${esc(c)}">${esc(c)}${c !== 'Todas' ? ' · ' + conteo[c] : ''}</button>`).join('');
}
$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (!b) return; ciudad = b.dataset.c; chips(); pintar(); });

$('ubicar').addEventListener('click', () => {
  if (!navigator.geolocation) { $('estado').textContent = 'Tu navegador no permite ubicación. Escoge tu ciudad abajo.'; return; }
  $('estado').textContent = 'Buscando tu ubicación…';
  navigator.geolocation.getCurrentPosition(p => {
    yo = [p.coords.latitude, p.coords.longitude];
    cercana = tiendas.map(t => ({...t, d: km(yo[0], yo[1], t.lat, t.lng)})).sort((a, b) => a.d - b.d)[0];
    ciudad = 'Todas'; chips();
    $('estado').textContent = cercana ? `Tu OAKBERRY más cercano es ${cercana.nombre}, a ${fmt(cercana.d)} 💜` : '';
    pintar(); $('mapa').scrollIntoView({behavior: 'smooth', block: 'center'});
  }, () => { $('estado').textContent = 'No pudimos ver tu ubicación. Escoge tu ciudad abajo.'; }, {enableHighAccuracy: true, timeout: 10000});
});

fetch(API).then(r => r.json()).then(d => {
  tiendas = (d.tiendas || []).filter(t => t.nombre).map(t => ({...t, nombre: limpiar(t.nombre), ciudad: ciudadBonita(t.ciudad),
    lat: t.lat != null ? +t.lat : null, lng: t.lng != null ? +t.lng : null}));
  const nc = new Set(tiendas.map(t => t.ciudad)).size;
  $('conteo').textContent = `${tiendas.length} tiendas en ${nc} ciudades`;
  const pc = new URLSearchParams(location.search).get('ciudad');
  if (pc) ciudad = ciudadBonita(pc);
  chips(); pintar();
}).catch(() => { $('lista').innerHTML = '<p class="cargando">No pudimos cargar las tiendas. Intenta de nuevo en un momento.</p>'; });
</script>
</body>
</html>
