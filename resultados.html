<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#F5EEE0">
<title>Resultados encuestas · OAKBERRY</title>
<!-- Tablero interno: solo agregados, con clave en el link (?k=). No se indexa. -->
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="pd-assets/nexa-slab-black.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="pd-assets/nexa-slab-regular.woff2" as="font" type="font/woff2" crossorigin>
<style>
/* ─────────────────────────────────────────────────────────────────────────
   Tablero de resultados de las encuestas del Purple Day (25–27 sep 2026).
   Datos: api.oakberry-cupones.com?accion=encuestasResultados (solo agregados).
   Se recalcula como máximo 1 vez por hora y queda congelado el domingo 27 a
   medianoche (decisión de Daniel: que no coma máquina). Esta página pide los
   datos al abrir y vuelve a pedir cuando toca la próxima foto.
   Una sola serie por gráfico → un solo color (morado); el número va escrito.
   ───────────────────────────────────────────────────────────────────────── */
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-bold.woff2') format('woff2');font-weight:600 700;font-display:swap}
@font-face{font-family:'Nexa Slab';src:url('pd-assets/nexa-slab-black.woff2') format('woff2');font-weight:800 900;font-display:swap}
:root{
  --crema:#FBF6E9; --cielo:#F5EEE0; --hueso:#EAE1CC;
  --tinta:#21152A; --tinta-suave:#5C4A66; --tinta-tenue:#8A7A92;
  --morado:#4B1F60; --lila:#B79CC8; --lila-claro:#EFE6F3; --oro:#F4B223;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{background:var(--cielo);-webkit-text-size-adjust:100%}
body{font-family:'Nexa Slab',Rockwell,Georgia,serif;background:var(--cielo);color:var(--tinta);font-size:15px;line-height:1.45}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 48px}
header{padding:26px 0 14px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:clamp(1.5rem,4.5vw,2.2rem);font-weight:900;text-transform:uppercase;color:var(--morado);line-height:1}
.sub{font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);font-weight:700;margin-bottom:6px}
.estado{font-size:.85rem;color:var(--tinta-suave);text-align:right}
.estado b{color:var(--tinta)}
.tabs,.chips{display:flex;flex-wrap:wrap;gap:8px}
.tabs{margin:6px 0 16px}
.tab,.chip{font-family:inherit;cursor:pointer;border:2px solid var(--morado);background:var(--crema);color:var(--morado);
  font-weight:800;border-radius:999px;padding:9px 16px;font-size:.88rem}
.tab.on,.chip.on{background:var(--morado);color:var(--crema)}
.chip{border-width:1.5px;padding:6px 12px;font-size:.8rem;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--crema);border-radius:16px;padding:14px 16px;box-shadow:0 3px 0 var(--hueso)}
.kpi .l{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta-suave);font-weight:700}
.kpi .v{font-size:1.9rem;font-weight:900;color:var(--tinta);line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:.8rem;color:var(--tinta-suave);margin-top:2px}
.filtro{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:4px 0 14px}
.filtro span{font-size:.8rem;color:var(--tinta-suave);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.card{background:var(--crema);border-radius:16px;padding:16px 16px 12px;box-shadow:0 3px 0 var(--hueso)}
.card h3{font-size:1rem;font-weight:900;color:var(--morado);line-height:1.25}
.card .q{font-size:.8rem;color:var(--tinta-suave);margin:3px 0 12px}
.fila{display:grid;grid-template-columns:minmax(120px,42%) 1fr 74px;align-items:center;gap:10px;padding:4px 0;position:relative}
.fila .et{font-size:.83rem;line-height:1.2}
.fila .pista{height:14px;background:var(--lila-claro);border-radius:0 4px 4px 0}
.fila .barra{height:14px;background:var(--morado);border-radius:0 4px 4px 0;min-width:2px}
.fila .num{font-size:.83rem;text-align:right;font-variant-numeric:tabular-nums;color:var(--tinta)}
.fila .num small{color:var(--tinta-tenue)}
.fila:hover .barra{background:#6A3585}
.vacio{font-size:.85rem;color:var(--tinta-tenue);padding:8px 0}
.n{font-size:.75rem;color:var(--tinta-tenue);margin-top:8px}
.horas{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.horas .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;min-width:0;height:100%}
.horas .b{width:100%;max-width:28px;background:var(--morado);border-radius:4px 4px 0 0;min-height:2px}
.horas .x{font-size:.6rem;color:var(--tinta-tenue);margin-top:4px;white-space:nowrap}
.textos{list-style:none;max-height:360px;overflow:auto}
.aviso-n{font-size:.82rem;color:var(--tinta-suave);background:var(--crema);border-left:3px solid var(--oro);padding:8px 12px;border-radius:0 8px 8px 0;margin:-4px 0 14px}
.textos li{padding:8px 0;border-bottom:1px solid var(--hueso);font-size:.88rem}
.textos li small{display:block;color:var(--tinta-tenue);font-size:.72rem;margin-top:2px}
.ancho{grid-column:1 / -1}
#tip{position:fixed;pointer-events:none;background:var(--tinta);color:var(--crema);font-size:.8rem;padding:6px 9px;border-radius:8px;opacity:0;transition:opacity .1s;z-index:9}
.err{background:#fff;border:2px solid #B3261E;color:#B3261E;border-radius:12px;padding:14px;margin-top:20px;font-weight:700}
.oculto{display:none!important}
/* ── Summary ── */
.sm-hero{background:var(--morado);color:var(--crema);border-radius:18px;padding:20px 20px 18px;margin-bottom:14px}
.sm-hero h2{font-size:clamp(1.3rem,4vw,1.8rem);font-weight:900;text-transform:uppercase;line-height:1.05}
.sm-hero p{margin-top:8px;font-size:.92rem;max-width:860px}
.sm-hero .ctx{margin-top:10px;padding-top:10px;border-top:1px solid rgba(251,246,233,.25);font-size:.85rem;color:var(--lila-claro)}
.sm-h{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--tinta-suave);font-weight:800;margin:20px 0 10px}
.sm-cuenta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.sm-cuenta span{font-size:.8rem;font-weight:700;background:var(--crema);border-radius:999px;padding:5px 11px;box-shadow:0 2px 0 var(--hueso)}
.ins{display:flex;flex-direction:column;gap:10px}
.ins h3{font-size:1.02rem}
.ins .top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:6px}
.tag{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;border-radius:999px;padding:3px 9px;background:var(--lila-claro);color:var(--morado)}
.tag.id{background:var(--tinta);color:var(--crema)}
.f-fuerte{background:#DCEFD9;color:#1E5B1A}.f-media{background:#FBEBC4;color:#7A5200}.f-debil{background:#F6DCD9;color:#8C2A20}
.e-por_validar{background:var(--crema);border:1.5px solid var(--tinta-tenue);color:var(--tinta-suave)}
.e-en_curso{background:var(--oro);color:var(--tinta)}.e-validado{background:#1E5B1A;color:#fff}.e-descartado{background:#8C2A20;color:#fff}
.ins dl{display:grid;grid-template-columns:92px 1fr;gap:6px 12px;margin-top:8px;font-size:.87rem}
.ins dt{font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--tinta-suave);padding-top:2px}
.ins dd.val{background:var(--lila-claro);border-radius:8px;padding:6px 9px}
.tbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--hueso)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl th{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta-suave)}
.tbl td.hi{background:var(--morado);color:var(--crema);font-weight:800}
.tbl-w{overflow-x:auto}
.lista{padding-left:18px;font-size:.88rem}.lista li{margin:6px 0}
.hito{display:grid;grid-template-columns:110px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid var(--hueso);font-size:.88rem}
.hito b{color:var(--morado)}
/* En simple */
.formula{background:var(--crema);border-radius:16px;padding:18px;box-shadow:0 3px 0 var(--hueso);display:flex;flex-direction:column;gap:12px;margin-bottom:12px}
.formula h3{font-size:1rem;font-weight:900;color:var(--morado)}
.formula .txt{max-width:64ch;font-size:.92rem}
.ecua{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.ecua .op{font-weight:900;font-size:1.5rem;color:var(--tinta-tenue);align-self:center}
.term{flex:1 1 150px;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.term b{font-weight:900;font-size:1.05rem}
.term span{font-size:.8rem;line-height:1.3}
.term.venta{background:var(--morado);color:var(--crema);flex:0 1 110px;justify-content:center}
.p-personas{background:#DDEBF5;color:#123C5A}.p-visitas{background:#FBE3CF;color:#6B2F05}.p-ticket{background:#E2F0DA;color:#244A12}.p-foco{background:var(--lila-claro);color:var(--morado)}
.hoy{border-left:4px solid var(--oro);padding:4px 0 4px 12px;font-size:.9rem;font-weight:700}
.simples{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
.simples .sim:last-child:nth-child(odd){grid-column:1 / -1}
.sim{background:var(--crema);border-radius:16px;padding:16px;box-shadow:0 3px 0 var(--hueso);display:flex;flex-direction:column;gap:10px;min-width:0}
.sim .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.avance{border-left:4px solid var(--oro);background:#FDF3D8;border-radius:0 10px 10px 0;padding:8px 10px;font-size:.86rem;display:flex;flex-direction:column;gap:2px}
.sim .pie{margin-top:auto}
.con-tip{position:relative}
.tip-w{display:inline-block}
.tip-b{border:0;cursor:help;font-family:inherit}
.tip-b:focus-visible{outline:3px solid var(--oro);outline-offset:2px}
.tip-t{position:absolute;left:0;top:calc(100% + 6px);z-index:5;width:min(360px,100%);background:var(--tinta);color:var(--crema);font-size:.82rem;line-height:1.45;font-weight:400;letter-spacing:0;text-transform:none;padding:10px 12px;border-radius:10px;box-shadow:0 6px 18px rgba(33,21,42,.25);opacity:0;visibility:hidden;transition:opacity .12s}
.tip-w:hover .tip-t,.tip-b:focus-visible+.tip-t,.tip-w.abierto .tip-t{opacity:1;visibility:visible}
.sim .cree{font-weight:800;font-size:1rem;line-height:1.3}
.paso{display:flex;flex-direction:column;gap:2px;font-size:.88rem}
.paso .lb{font-size:.64rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--tinta-suave)}
.paso.venta-si{border-radius:10px;padding:8px 10px}
.paso.venta-si .lb{color:inherit}
.sim .ver{font-size:.78rem;color:var(--morado);font-weight:700;background:none;border:0;cursor:pointer;font-family:inherit;padding:0}
.sim .ver:hover{text-decoration:underline}
@media (max-width:520px){ .simples{grid-template-columns:1fr} }
@media (max-width:520px){ .ins dl{grid-template-columns:1fr} .ins dt{padding-top:6px} .hito{grid-template-columns:1fr;gap:2px} }
@media (max-width:520px){ .fila{grid-template-columns:minmax(96px,40%) 1fr 64px} .grid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><p class="sub">Purple Day · 6 años</p><h1>Resultados de las encuestas</h1></div>
    <p class="estado" id="estado">Cargando…</p>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab on" data-enc="summary">Summary · qué aprendimos</button>
    <button class="tab" data-enc="cuentanos">Clientes Loopy · por qué cayó la venta</button>
    <button class="tab" data-enc="celebra">Cupones sin canjear</button>
    <button class="tab" data-enc="tienda">En tienda (QR) · llegaron sin invitación</button>
  </div>

  <div id="vista"></div>
  <div id="err" class="err oculto"></div>
</div>
<div id="tip"></div>

<script>
const API = 'https://api.oakberry-cupones.com/';
const K = new URLSearchParams(location.search).get('k') || '';
const $ = id => document.getElementById(id);
let D = null, ENC = 'summary', SEG = 'todos', TSEG = 'todos', CIU = 'todas', timer = null;

const SEGS = { todos:'Todos', activo:'Activos (≤30 d)', bajo:'Bajaron (31–90 d)', se_fue:'Se fueron (>90 d)', nuevo_tienda:'Tienda · nuevos (QR)' };

/* Cada pregunta: texto, y etiqueta legible por valor guardado. */
const Q = {
  celebra: [
    ['p1_probado','¿Has probado OAKBERRY?',{varias:'Sí, varias veces',una_vez:'Sí, una vez',todavia_no:'Todavía no'}],
    ['p2_antojo','Cuando se te antoja algo rico, ¿qué escoges? (varias)',{helado_postre:'Helado o postre',cafe_panaderia:'Café y panadería',saludable:'Jugo, fruta o saludable',acai_otra:'Açaí de otra marca',comida_rapida:'Comida rápida',otro:'Otra cosa'}],
    ['p3_saber','Antes de probar un lugar nuevo, ¿qué te gustaría saber?',{que_es_acai:'Qué es el açaí',precio:'Cuánto cuesta',sabores:'Sabores y toppings',cerca:'Si queda cerca',recomendacion:'Si alguien lo recomienda',nada:'Nada, me arriesgo'}],
    ['p4_invitacion','¿Qué pasó con la invitación (cupón)?',{no_vi:'No la vi / no me acuerdo',se_paso_fecha:'Se me pasó la fecha',tienda_lejos:'No encontré tienda cómoda',fui_no_pude:'Fui, pero no pude usarla',otro_momento:'La dejé para otro momento',otra:'Otra cosa'}],
    ['p5_canal','Si hoy te antojaras, ¿cómo lo pedirías?',{tienda:'Iría a la tienda',domicilio:'A domicilio (Rappi u otra)',de_camino:'De camino a algo',no_se:'Todavía no sé'}],
  ],
  cuentanos: [
    ['p1_describe','P1 · ¿Cómo le describirías OAKBERRY a un amigo?',{antojo:'Un antojo o postre',saludable:'Algo saludable para cualquier día',entreno:'Para después de entrenar',comida_ligera:'Desayuno o almuerzo ligero',gusto:'Un gusto de vez en cuando'}],
    ['p2_siente','P2 · Después de comerte un OAKBERRY te sientes…',{energia:'Con energía y liviano',lleno:'Lleno, como una comida',gusto:'Como si me diera un gusto',empalagado:'Empalagado, muy dulce',hambre:'Con hambre al rato'}],
    ['p3_causa','P3a · La última vez que no compraste, ¿qué pasó? (bajaron / se fueron)',{plata:'Mucha plata para ese momento',otra_cosa:'Compré otra cosa más fácil',tienda:'Cerrada, lejos o con fila',domicilio:'A domicilio salía caro',visto:'Muy visto, quería algo distinto',olvido:'Dejé de pensar en OAKBERRY'}],
    ['p3_retener','P3b · ¿Qué haría que vinieras más seguido? (activos)',{precio:'Precio más cómodo',tamanos:'Tamaños más pequeños o completos',novedad:'Cosas nuevas',recordar:'Que me lo recuerden',cerca:'Más cerca / domicilio fácil'}],
    ['p4_sustituto','P4 · Cuando no compras OAKBERRY, ¿qué compras?',{helado_yogurt:'Helado o yogurt',cafe_pastel:'Café y pastel',jugo_fruta:'Jugo o fruta',acai_otra:'Açaí de otra marca',comida_rapida:'Comida rápida',nada:'Nada'}],
    ['p4_precio','P4 · ¿Cuánto pagas por eso? (nuestro 9 oz: $21.900 · 12 oz: $25.400)',{menos_10:'Menos de $10.000','10_15':'$10.000–15.000','15_20':'$15.000–20.000','20_25':'$20.000–25.000',mas_25:'Más de $25.000',mas_20:'Más de $20.000 (rango viejo)'},'orden'],
    ['p5_oferta','P5 · Si hoy fueras, ¿cuál escogerías?',{pequeno:'Más pequeño y más barato',proteina:'Con más proteína, pagando más',combo:'Combo bowl + bebida',igual:'El de siempre, tal como está'}],
    ['p6_novedad','P6 · ¿Sabías del topping choco avellana?',{probe:'Sí, y lo probé',sabia_no_probe:'Sí, pero no lo he probado',no_sabia:'No sabía'},'orden'],
  ]
};

const fmt = n => (n || 0).toLocaleString('es-CO');
const pct = (a, b) => b ? Math.round(a * 1000 / b) / 10 : 0;
const hora = ts => new Date(ts * 1000).toLocaleString('es-CO', { weekday:'short', hour:'2-digit', minute:'2-digit', hour12:true, timeZone:'America/Bogota' });

/* Filtro por ciudad (5-oct): con CIU = 'todas' se usan los agregados de siempre;
   con una ciudad, se suman las filas [seg, ciudad, pregunta, valor, n] de D.por_ciudad. */
function desdeFilas(enc, col){
  const out = {}, F = ((D.por_ciudad || {})[enc] || {}).filas || [];
  F.forEach(f => {
    const [seg, c, q, v, n] = enc === 'cuentanos' ? f : ['todos', ...f];
    if (q !== col || c !== CIU) return;
    if (enc === 'cuentanos' && SEG !== 'todos' && seg !== SEG) return;
    out[v] = (out[v] || 0) + n;
  });
  return out;
}
function chipsCiudad(enc){
  const N = ((D.por_ciudad || {})[enc] || {}).n || {};
  const orden = Object.entries(N).filter(([c]) => c !== 'Sin ciudad').sort((a, b) => b[1] - a[1]);
  if (!orden.length) return '';
  let h = '<div class="filtro"><span>Ciudad:</span><div class="chips">' +
    `<button class="chip${CIU === 'todas' ? ' on' : ''}" data-ciu="todas">Todas</button>` +
    orden.map(([c, n]) => `<button class="chip${CIU === c ? ' on' : ''}" data-ciu="${c}">${c} · ${fmt(n)}</button>`).join('') + '</div></div>';
  if (CIU !== 'todas' && (N[CIU] || 0) < 50)
    h += `<p class="aviso-n">${CIU}: ${fmt(N[CIU] || 0)} respuestas en total. Muestra chica: léela como tendencia, no como cifra exacta.</p>`;
  return h;
}
function sumaSeg(obj){  /* {seg:{v:n}} → {v:n} filtrado por SEG */
  const out = {};
  Object.entries(obj || {}).forEach(([s, d]) => { if (SEG === 'todos' || s === SEG) Object.entries(d).forEach(([v, n]) => out[v] = (out[v] || 0) + n); });
  return out;
}

function tarjeta(titulo, cuentas, etiquetas, orden){
  let filas = Object.entries(etiquetas).map(([v, et]) => [v, et, cuentas[v] || 0]).filter(f => f[2] > 0 || !f[1].includes('viejo'));
  const total = filas.reduce((a, f) => a + f[2], 0);
  if (!orden) filas.sort((a, b) => b[2] - a[2]);
  const max = Math.max(1, ...filas.map(f => f[2]));
  const cuerpo = total ? filas.map(([v, et, n]) =>
    `<div class="fila" data-tip="${et}: ${fmt(n)} (${pct(n, total)}%)"><span class="et">${et}</span>` +
    `<div class="pista"><div class="barra" style="width:${n / max * 100}%"></div></div>` +
    `<span class="num">${pct(n, total)}% <small>${fmt(n)}</small></span></div>`).join('')
    : '<p class="vacio">Sin respuestas todavía en este segmento.</p>';
  return `<section class="card"><h3>${titulo}</h3>${cuerpo}<p class="n">${fmt(total)} respuestas</p></section>`;
}

function kpis(env, resp){
  const e = env || {};
  return `<div class="kpis">
    <div class="kpi"><div class="l">Enviados</div><div class="v">${fmt(e.enviados)}</div><div class="d">WhatsApp aceptados por Meta</div></div>
    <div class="kpi"><div class="l">Entregados</div><div class="v">${fmt(e.entregados)}</div><div class="d">${pct(e.entregados, e.enviados)}% de enviados</div></div>
    <div class="kpi"><div class="l">Leídos</div><div class="v">${fmt(e.leidos)}</div><div class="d">${pct(e.leidos, e.entregados)}% de entregados</div></div>
    <div class="kpi"><div class="l">Fallidos</div><div class="v">${fmt(e.fallidos)}</div><div class="d">${pct(e.fallidos, e.enviados)}% de enviados</div></div>
    <div class="kpi"><div class="l">Respondieron</div><div class="v">${fmt(resp)}</div><div class="d">${pct(resp, e.entregados)}% de entregados</div></div>
  </div>`;
}

function porHora(enc){
  const filas = (D.por_hora || []).filter(r => r.enc === enc);
  if (!filas.length) return '';
  const max = Math.max(...filas.map(r => r.n));
  return `<section class="card ancho"><h3>Respuestas por hora</h3><p class="q">Hora de Bogotá</p><div class="horas">` +
    filas.map(r => `<div class="col" data-tip="${r.h}: ${fmt(r.n)} respuestas"><div class="b" style="height:${r.n / max * 100}%"></div><span class="x">${r.h.slice(-5)}</span></div>`).join('') +
    `</div></section>`;
}

const esc = t => String(t == null ? '' : t).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const FZ = { fuerte:'Evidencia fuerte', media:'Evidencia media', debil:'Evidencia débil', 'débil':'Evidencia débil' };
const ES = { por_validar:'Por validar', en_curso:'En curso', validado:'Validado', descartado:'Descartado' };
let STEMA = 'todos';

function summary(){
  const S = D.summary;
  if (!S) return '<p class="vacio">El resumen no está disponible en este momento.</p>';
  let h = `<section class="sm-hero"><p class="sub" style="color:var(--lila)">Actualizado ${esc(S.actualizado)}</p><h2>${esc(S.titulo)}</h2><p>${esc(S.bajada)}</p>` +
    (S.contexto ? `<p class="ctx">${esc(S.contexto)}</p>` : '') + '</section>';
  h += '<div class="kpis">' + (S.kpis || []).map(k => `<div class="kpi"><div class="l">${esc(k.l)}</div><div class="v">${esc(k.v)}</div><div class="d">${esc(k.d)}</div></div>`).join('') + '</div>';

  const ins = S.insights || [];
  const F = S.formula, PAL = {};
  if (F) {
    [...F.partes, F.extra].forEach(x => PAL[x.k] = x.t);
    h += '<p class="sm-h">En simple: qué queremos probar</p>';
    h += `<section class="formula"><h3>${esc(F.titulo)}</h3><p class="txt">${esc(F.texto)}</p>
      <div class="ecua"><div class="term venta"><b>Venta</b></div><span class="op">=</span>` +
      F.partes.map((x, n) => (n ? '<span class="op">×</span>' : '') + `<div class="term p-${x.k}"><b>${esc(x.t)}</b><span>${esc(x.d)}</span></div>`).join('') +
      `</div><p class="txt con-tip" style="font-size:.84rem;color:var(--tinta-suave)">Hay una cuarta que no está en la cuenta pero importa: <span class="tip-w"><button type="button" class="tag p-foco tip-b" aria-expanded="false">${esc(F.extra.t)} · ¿qué es?</button><span class="tip-t" role="tooltip">${esc(F.extra.detalle || F.extra.d)}</span></span> ${esc(F.extra.d)}.</p>
      <p class="hoy">${esc(F.hoy)}</p></section>`;
    h += '<div class="simples">' + ins.filter(i => i.simple).map(i => { const s = i.simple; return `<article class="sim">
      <div class="top"><span class="tag id">${esc(i.id)}</span><span class="tag p-${esc(s.palanca)}">Mueve: ${esc(PAL[s.palanca] || s.palanca)}</span></div>
      <p class="cree">${esc(s.creemos)}</p>
      <div class="paso"><span class="lb">Cómo lo probamos</span><span>${esc(s.probamos)}</span></div>
      <div class="paso venta-si p-${esc(s.palanca)}"><span class="lb">${i.estado === 'validado' ? 'Ya es cierto; así se vuelve venta' : 'Si es cierto, así se vuelve venta'}</span><span>${esc(s.venta)}</span></div>
      ${i.avance ? `<div class="avance"><span class="lb">Qué vemos hasta hoy</span><span>${esc(i.avance)}</span></div>` : ''}
      <div class="top pie"><span class="tag e-${esc(i.estado)}">${ES[i.estado] || esc(i.estado)}</span><button type="button" class="ver" data-ir="${esc(i.id)}">Ver el dato →</button></div>
    </article>`; }).join('') + '</div>';
  }
  const cuenta = {}; ins.forEach(i => cuenta[i.estado] = (cuenta[i.estado] || 0) + 1);
  const temas = ['todos', ...new Set(ins.map(i => i.tema))];
  h += '<p class="sm-h">Detalle técnico</p><div class="sm-cuenta">' +
    Object.keys(ES).filter(e => cuenta[e]).map(e => `<span>${ES[e]}: ${cuenta[e]}</span>`).join('') + '</div>';
  h += '<div class="filtro"><span>Tema:</span><div class="chips">' +
    temas.map(t => `<button class="chip${STEMA === t ? ' on' : ''}" data-tema="${esc(t)}">${t === 'todos' ? 'Todos' : esc(t)}</button>`).join('') + '</div></div>';
  h += '<div class="grid ins">' + ins.filter(i => STEMA === 'todos' || i.tema === STEMA).map(i => `<section class="card" id="ins-${esc(i.id)}">
      <div class="top"><span class="tag id">${esc(i.id)}</span><span class="tag">${esc(i.tema)}</span>
        <span class="tag f-${esc(i.fuerza).replace('é','e')}">${FZ[i.fuerza] || esc(i.fuerza)}</span>
        <span class="tag e-${esc(i.estado)}">${ES[i.estado] || esc(i.estado)}</span></div>
      <h3>${esc(i.titulo)}</h3>
      <dl><dt>Dato</dt><dd>${esc(i.evidencia)}</dd><dt>Implica</dt><dd>${esc(i.implica)}</dd>
      <dt>Cómo validar</dt><dd class="val">${esc(i.validar)}</dd>${i.avance ? `<dt>Hasta hoy</dt><dd class="avance">${esc(i.avance)}</dd>` : ''}</dl></section>`).join('') + '</div>';

  const E = S.edad;
  if (E) {
    h += `<p class="sm-h">${esc(E.titulo)}</p><section class="card"><div class="tbl-w"><table class="tbl"><thead><tr><th></th>` +
      E.columnas.map(c => `<th>${esc(c)}</th>`).join('') + '</tr></thead><tbody>' +
      E.filas.map(([et, ...vs]) => { const mx = Math.max(...vs);
        return `<tr><td>${esc(et)}</td>` + vs.map(v => `<td class="${v === mx ? 'hi' : ''}">${v}%</td>`).join('') + '</tr>'; }).join('') +
      `</tbody></table></div><p class="n">${esc(E.nota)} El máximo de cada fila va resaltado.</p></section>`;
  }
  h += '<div class="grid" style="margin-top:12px">';
  if ((S.evento || []).length) h += '<section class="card"><h3>Qué pasó con la venta del evento</h3><ul class="lista">' + S.evento.map(t => `<li>${esc(t)}</li>`).join('') + '</ul></section>';
  if ((S.advertencias || []).length) h += '<section class="card"><h3>Cuidado al leerlo</h3><ul class="lista">' + S.advertencias.map(t => `<li>${esc(t)}</li>`).join('') + '</ul></section>';
  if ((S.hitos || []).length) h += '<section class="card ancho"><h3>Próximas mediciones</h3>' + S.hitos.map(x => `<div class="hito"><b>${esc(x.fecha)}</b><span>${esc(x.que)}</span></div>`).join('') + '</section>';
  return h + '</div>';
}

function pintar(){
  if (!D) return;
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('on', b.dataset.enc === ENC));
  let h = '';
  if (ENC === 'summary') {
    h = summary();
  } else if (ENC === 'cuentanos') {
    const r = D.cuentanos.respondieron || {};
    const total = Object.entries(r).filter(([s]) => s !== 'qa').reduce((a, [, n]) => a + n, 0);
    h += kpis(D.envios.cuentanos_6_anos, total);
    h += '<div class="filtro"><span>Segmento (sale de Loopy):</span><div class="chips">' +
      Object.entries(SEGS).map(([s, et]) => `<button class="chip${SEG === s ? ' on' : ''}" data-seg="${s}">${et}${s === 'todos' ? '' : ' · ' + fmt(r[s] || 0)}</button>`).join('') + '</div></div>';
    h += chipsCiudad('cuentanos');
    const cuenta = k => CIU === 'todas' ? sumaSeg(D.cuentanos.preguntas[k]) : desdeFilas('cuentanos', k);
    h += '<div class="grid">' + Q.cuentanos.map(([k, t, et, o]) => tarjeta(t, cuenta(k), et, o)).join('');
    const fuenteTx = CIU === 'todas' ? (D.cuentanos.textos || []) : (((D.por_ciudad || {}).cuentanos || {}).textos || []).filter(x => x.ciudad === CIU);
    const tx = fuenteTx.filter(x => SEG === 'todos' || x.seg === SEG);
    h += `<section class="card"><h3>P7 · Si pudieras cambiar una sola cosa…</h3><p class="q">Últimas respuestas, en sus palabras</p>` +
      (tx.length ? '<ul class="textos">' + tx.map(x => `<li>${x.t.replace(/</g, '&lt;')}<small>${SEGS[x.seg] || x.seg} · ${x.h}</small></li>`).join('') + '</ul>' : '<p class="vacio">Sin respuestas todavía.</p>') + '</section>';
    const mc = D.cuentanos.marcas || [];
    if (CIU === 'todas') {  /* marcas y horas son nacionales: solo sin filtro de ciudad */
      if (mc.length) h += tarjeta('Açaí de otra marca · ¿cuál?', Object.fromEntries(mc.map(m => [m.m, m.n])), Object.fromEntries(mc.map(m => [m.m, m.m])));
      h += porHora('cuentanos');
    }
    h += '</div>';
  } else if (ENC === 'tienda') {
    const t = D.tienda || { total:0, nuevos:0, loopy:0, preguntas:{} };
    const horas = (D.por_hora || []).filter(r => r.enc === 'tienda');
    const pico = horas.reduce((a, r) => r.n > (a ? a.n : -1) ? r : a, null);
    h += `<div class="kpis">
      <div class="kpi"><div class="l">Respondieron en tienda</div><div class="v">${fmt(t.total)}</div><div class="d">Escanearon el QR del hablador o afiche</div></div>
      <div class="kpi"><div class="l">Nuevos</div><div class="v">${fmt(t.nuevos)}</div><div class="d">${pct(t.nuevos, t.total)}% · no estaban en la base de WhatsApp</div></div>
      <div class="kpi"><div class="l">Clientes Loopy</div><div class="v">${fmt(t.loopy)}</div><div class="d">No habían respondido por WhatsApp</div></div>
      <div class="kpi"><div class="l">Hora pico</div><div class="v">${pico ? pico.h.slice(-5) : '—'}</div><div class="d">${pico ? fmt(pico.n) + ' respuestas' : ''}</div></div>
    </div>`;
    const TS = { todos:'Todos', nuevo_tienda:'Nuevos', loopy:'Clientes Loopy' };
    h += '<div class="filtro"><span>Quiénes:</span><div class="chips">' +
      Object.entries(TS).map(([s, et]) => `<button class="chip tchip${TSEG === s ? ' on' : ''}" data-tseg="${s}">${et}</button>`).join('') + '</div></div>';
    const suma = obj => { const out = {}; Object.entries(obj || {}).forEach(([sg, d]) => {
      const ok = TSEG === 'todos' || (TSEG === 'nuevo_tienda' ? sg === 'nuevo_tienda' : sg !== 'nuevo_tienda');
      if (ok) Object.entries(d).forEach(([v, n]) => out[v] = (out[v] || 0) + n); }); return out; };
    const QT = Q.cuentanos.filter(([k]) => ['p1_describe','p2_siente','p4_sustituto','p4_precio','p5_oferta','p6_novedad'].includes(k));
    h += '<div class="grid">' + QT.map(([k, tt, et, o]) => tarjeta(tt, suma(t.preguntas[k]), et, o)).join('');
    h += porHora('tienda') + '</div>';
  } else {
    h += kpis(D.envios.celebra_6_anos, D.celebra.respondieron);
    h += chipsCiudad('celebra');
    const cuentaC = k => CIU === 'todas' ? ((D.celebra.preguntas[k] || {}).todos || {}) : desdeFilas('celebra', k);
    h += '<div class="grid">' + Q.celebra.map(([k, t, et, o]) => tarjeta(t, cuentaC(k), et, o)).join('');
    h += (CIU === 'todas' ? porHora('celebra') : '') + '</div>';
  }
  $('vista').innerHTML = h;
  document.querySelectorAll('.chip[data-seg]').forEach(b => b.onclick = () => { SEG = b.dataset.seg; pintar(); });
  document.querySelectorAll('.tip-b').forEach(b => b.onclick = e => { e.stopPropagation();
    const w = b.parentElement, on = !w.classList.contains('abierto'); w.classList.toggle('abierto', on); b.setAttribute('aria-expanded', on); });
  document.querySelectorAll('.ver[data-ir]').forEach(b => b.onclick = () => {
    if (!document.getElementById('ins-' + b.dataset.ir)) { STEMA = 'todos'; pintar(); }
    const el = document.getElementById('ins-' + b.dataset.ir); if (el) el.scrollIntoView({ behavior:'smooth', block:'start' }); });
  document.querySelectorAll('.chip[data-tema]').forEach(b => b.onclick = () => { STEMA = b.dataset.tema; pintar(); });
  document.querySelectorAll('.chip[data-tseg]').forEach(b => b.onclick = () => { TSEG = b.dataset.tseg; pintar(); });
  document.querySelectorAll('.chip[data-ciu]').forEach(b => b.onclick = () => { CIU = b.dataset.ciu; pintar(); });
}

function estado(){
  if (!D) return;
  $('estado').innerHTML = D.congelado
    ? `Foto final: <b>${hora(D.corte)}</b><br>Congelado desde el domingo 27 a medianoche`
    : `Actualizado: <b>${hora(D.corte)}</b><br>Próxima actualización: ${hora(D.proxima)}`;
}

function cargar(){
  if (!K) { $('err').textContent = 'Falta la clave en el link (?k=…).'; $('err').classList.remove('oculto'); $('estado').textContent = ''; return; }
  const qs = 'accion=encuestasResultados&k=' + encodeURIComponent(K);
  const ok = d => {
    if (!d || !d.ok) { $('err').textContent = (d && d.mensaje) || 'No se pudieron cargar los datos.'; $('err').classList.remove('oculto'); return; }
    $('err').classList.add('oculto'); D = d; estado(); pintar();
    clearTimeout(timer);
    if (!d.congelado && d.proxima) timer = setTimeout(cargar, Math.max(60, d.proxima - Date.now() / 1000 + 30) * 1000);
  };
  fetch(API + '?' + qs).then(r => r.json()).then(ok).catch(() => {
    const cb = 'dash_' + Date.now(); window[cb] = d => { delete window[cb]; ok(d); };
    const s = document.createElement('script'); s.src = API + '?' + qs + '&callback=' + cb; document.body.appendChild(s);
  });
}

document.addEventListener('click', () => document.querySelectorAll('.tip-w.abierto').forEach(w => w.classList.remove('abierto')));
document.querySelectorAll('.tab').forEach(b => b.onclick = () => { ENC = b.dataset.enc; SEG = 'todos'; pintar(); });
/* Tooltip al pasar por cada barra (la cifra ya está escrita; esto es el detalle). */
document.addEventListener('mousemove', e => {
  const t = e.target.closest('[data-tip]'), tip = $('tip');
  if (!t) { tip.style.opacity = 0; return; }
  tip.textContent = t.dataset.tip; tip.style.opacity = 1;
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});
cargar();
</script>
</body>
</html>
